name: Publish doodl-ai-react to npm

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: |
          cd web/wrappers/react-wrapper
          rm -rf package-lock.json node_modules
          npm install

      - name: Build React library
        run: |
          cd web/wrappers/react-wrapper
          npm run build:lib

      - name: Check if version changed and publish
        run: |
          cd web/wrappers/react-wrapper
          CURRENT_VERSION=$(node --input-type=commonjs -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('./projects/doodl-ai-react/package.json','utf8')).version)")
          PUBLISHED_VERSION=$(npm view doodl-ai-react version || echo "0.0.0")
          echo "Current version: $CURRENT_VERSION"
          echo "Published version: $PUBLISHED_VERSION"
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version has not changed. Skipping publish."
            exit 0
          else
            echo "New version detected. Publishing to npm..."
            cd dist/doodl-ai-react
            npm publish --provenance --access public
          fi
